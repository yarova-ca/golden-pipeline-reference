name: CD REFERENCE API

# One CD per image, triggered by the merge itself, never chained onto another
# workflow. A UI registry hiccup must never kill an API release (GP-11..GP-13).

on:
  push:
    branches: [main]
    paths:
      - "src/api/**"
      - ".dockerignore"
      # This repo has no shared projects. In a repo that does, the shared globs
      # go above and this negation keeps a UI-only merge from rebuilding the API.
      - "!src/ui/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: cd-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Never put an inline comment on a `tags:` line. metadata-action parses
      # the whole line as the tag value and the build fails unreadably.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_NAMESPACE }}/reference-api
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_NAMESPACE }}/reference-api:latest
          format: sarif
          output: trivy-reference-api.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-reference-api.sarif
          category: trivy-reference-api
