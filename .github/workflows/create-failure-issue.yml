name: Create issue on pipeline failure

# Two swaps only: REFERENCE (four times, in the workflows list below) and
# rohithvarmayadla (once, in assignees). The workflow names must match your actual
# workflow `name:` values EXACTLY -- a renamed workflow silently unhooks its
# own alarm (GP-18).

on:
  workflow_run:
    workflows:
      - "CI REFERENCE"
      - "CD REFERENCE API"
      - "CD REFERENCE UI"
      - "Promote REFERENCE to TEST"
      - "Promote REFERENCE to PROD"
    types: [completed]

permissions:
  issues: write
  contents: read

jobs:
  ticket:
    # A failing PR is already its own alarm - a red check that blocks merge.
    # Only failures with no other audience raise an issue.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const title = `${run.name} failed on ${run.head_branch}`;
            const body = [
              `**Workflow:** ${run.name}`,
              `**Run:** ${run.html_url}`,
              `**Branch:** ${run.head_branch}`,
              `**By:** @${run.actor.login}`,
              `**Commit:** ${run.head_sha.slice(0, 7)}`,
            ].join('\n');
            try {
              await github.rest.issues.createLabel({ owner, repo, name: 'pipeline-failure', color: 'B60205' });
            } catch (e) { /* label already exists */ }
            // Dedup against the open issue for this same workflow: repeat
            // failures comment, they do not spam new issues.
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'pipeline-failure', per_page: 100,
            });
            const hit = open.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: hit.number, body: `Failed again: ${run.html_url}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['pipeline-failure'], assignees: ['rohithvarmayadla'],
              });
            }
