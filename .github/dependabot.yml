# Four ecosystems, monthly, ONE grouped PR each, every PR assigned to a person.
# Semver-majors are ignored everywhere on purpose: a framework major arrives as
# an ALERT to plan, never as a surprise PR that breaks CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    assignees: ["rohithvarmayadla"]
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /src/ui
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    assignees: ["rohithvarmayadla"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-safe: { patterns: ["*"] }

  # Glob, so every referenced project is covered - not just the app csproj.
  - package-ecosystem: nuget
    directories: ["/**/*"]
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    assignees: ["rohithvarmayadla"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-safe: { patterns: ["*"] }

  # Only the directories CD actually builds. This is what keeps the digest
  # pins in the two Dockerfiles fresh.
  - package-ecosystem: docker
    directories: ["/src/api", "/src/ui"]
    schedule: { interval: monthly }
    assignees: ["rohithvarmayadla"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker: { patterns: ["*"] }
